services:
  postgres:
    image: postgres:16-alpine
    container_name: procurement_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: procurement_db
    ports:
      - "5433:5432"
    volumes:
      - procurement_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    container_name: procurement_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: procurement_db
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: python -m pipeline.run_pipeline

volumes:
  procurement_postgres_data: