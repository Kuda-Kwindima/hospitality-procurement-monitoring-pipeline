services:
  postgres:
    image: postgres:16-alpine
    container_name: procurement_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: procurement_db
    ports:
      - "5433:5432"
    volumes:
      - procurement_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procurement_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: procurement_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/procurement_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./pipeline:/opt/airflow/pipeline
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./requirements.txt:/opt/airflow/requirements.txt
    command: >
      bash -c "pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
               airflow db migrate &&
               airflow users create --username admin --password admin --firstname Kuda --lastname Admin --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: procurement_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/procurement_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: procurement_db
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./pipeline:/opt/airflow/pipeline
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./requirements.txt:/opt/airflow/requirements.txt
    command: >
      bash -c "pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
               airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: procurement_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/procurement_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: procurement_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./pipeline:/opt/airflow/pipeline
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./requirements.txt:/opt/airflow/requirements.txt
    command: >
      bash -c "pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
               airflow scheduler"

volumes:
  procurement_postgres_data: